name: build-windows

# Gera o Starfork pro Windows (instalador NSIS, *-setup.exe). O Tauri NÃO faz
# cross-compile a partir do macOS, então o build roda numa runner windows-latest.
# Dispare pela aba Actions (workflow_dispatch) ou empurrando uma tag v*. O
# publish-downloads.yml também chama este workflow (workflow_call).
on:
  workflow_dispatch:
  workflow_call:
  push:
    tags:
      - "v*"
    branches:
      - ci/windows-e-downloads # TEMPORÁRIO: validar antes do merge (workflow_dispatch só vale no main)

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # Mesmo passo do build-linux/package-app.sh: bundla o motor (cli.mjs) e o
      # MCP (server.mjs) pra app/src-tauri/resources (bundle.resources do tauri.conf.json).
      - name: Bundle do motor (esbuild)
        run: |
          rm -rf app/src-tauri/resources
          mkdir -p app/src-tauri/resources/engine app/src-tauri/resources/mcp
          npx -y esbuild src/cli.ts --bundle --platform=node --format=esm \
            --outfile=app/src-tauri/resources/engine/cli.mjs --log-level=error
          npx -y esbuild src/mcp/server.ts --bundle --platform=node --format=esm \
            --outfile=app/src-tauri/resources/mcp/server.mjs --log-level=error

      # O app não tem package-lock: instala o CLI do Tauri (devDependency) antes do build.
      - name: Dependências do app (CLI do Tauri)
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Tauri build (nsis)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          args: --bundles nsis

      - name: Publica o instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: starfork-windows
          path: app/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
