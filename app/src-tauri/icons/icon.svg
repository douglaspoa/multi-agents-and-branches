  <circle cx="478" cy="316" r="46" fill="url(#glowWhite)"/>
  <circle cx="478" cy="316" r="15" fill="#eef3ff"/>

  <!-- n4 (lider, verde) -->
  <circle cx="566" cy="486" r="104" fill="url(#glowGreen)"/>
