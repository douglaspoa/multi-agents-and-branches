<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2647"/>
      <stop offset="0.55" stop-color="#0e1630"/>
      <stop offset="1" stop-color="#070b17"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.34" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#2a3b70" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#101a38" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#32d74b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#32d74b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWhite" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dfe8ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#dfe8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="#0b1122"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#skyGrad)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#aura)"/>

  <!-- estrelas de fundo -->
  <g fill="#c9d6ff">
    <circle cx="762" cy="628" r="5" opacity="0.55"/>
    <circle cx="248" cy="704" r="4" opacity="0.45"/>
    <circle cx="648" cy="770" r="4" opacity="0.5"/>
    <circle cx="806" cy="470" r="4" opacity="0.4"/>
    <circle cx="196" cy="352" r="5" opacity="0.5"/>
    <circle cx="404" cy="772" r="3" opacity="0.45"/>
    <circle cx="726" cy="236" r="4" opacity="0.45"/>
    <circle cx="300" cy="252" r="3" opacity="0.4"/>
    <circle cx="560" cy="664" r="3" opacity="0.4"/>
    <circle cx="852" cy="708" r="3" opacity="0.35"/>
    <circle cx="176" cy="560" r="3" opacity="0.35"/>
  </g>

  <!-- arestas da constelação (branches) -->
  <g stroke="#57dc86" stroke-opacity="0.34" stroke-width="6" stroke-linecap="round" fill="none">
