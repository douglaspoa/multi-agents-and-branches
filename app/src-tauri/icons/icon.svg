  <!-- nós (estrelas-agente): glow + núcleo -->
  <circle cx="336" cy="712" r="60" fill="url(#glowWhite)"/>
  <circle cx="336" cy="712" r="21" fill="#eef3ff"/>

  <circle cx="452" cy="566" r="52" fill="url(#glowWhite)"/>
  <circle cx="452" cy="566" r="18" fill="#eef3ff"/>

  <circle cx="296" cy="452" r="54" fill="url(#glowWhite)"/>
  <circle cx="296" cy="452" r="19" fill="#eef3ff"/>

  <circle cx="706" cy="356" r="52" fill="url(#glowWhite)"/>
