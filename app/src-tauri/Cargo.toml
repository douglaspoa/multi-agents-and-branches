[package]
name = "cardume-app"
version = "0.0.1"
description = "Cardume — orquestrador visual de agentes"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cardume_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync"] }

# Notificação nativa com clique útil só existe no macOS (bundle + resposta do
# clique). No Linux/Windows o tauri-plugin-notification cobre o envio.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[profile.dev]
incremental = true
