[package]
name = "cardume-app"
version = "0.0.1"
description = "Cardume — orquestrador visual de agentes"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cardume_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.dev]
incremental = true
