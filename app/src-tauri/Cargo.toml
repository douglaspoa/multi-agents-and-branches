[package]
name = "cardume-app"
version = "0.0.1"
description = "Starfork — orquestrador visual de agentes"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cardume_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync"] }

# Notificação nativa com clique útil só existe no macOS: UNUserNotificationCenter
# (a API atual — a NSUserNotification antiga parou de aparecer depois do rename do
# app). No Linux/Windows o tauri-plugin-notification cobre o envio.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"

[profile.dev]
incremental = true
